name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check (mypy --strict)
        run: uv run mypy
      - name: Tests (PostgreSQL via Testcontainers)
        run: uv run pytest
      - name: Evaluation results reproduce from the repository (no API key)
        run: |
          uv run python -m payables.evaluation run --split dev --oracle --out eval
          uv run python -m payables.evaluation run --split holdout --oracle --out eval
          uv run python -m payables.evaluation phrasings --out eval
          if ls eval/recordings/*.json >/dev/null 2>&1; then
            uv run python -m payables.evaluation run --split holdout --out eval
          fi
          git diff --exit-code -- eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: One-command run, then a smoke test through nginx
        run: |
          docker compose up -d --build
          python3 scripts/smoke.py http://127.0.0.1:3100
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - run: docker compose down -v
