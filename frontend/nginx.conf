# Other host names are dropped (DNS rebinding).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:" always;

    error_page 413 /errors/413.json;
    error_page 502 503 504 /errors/unavailable.json;
    location ^~ /errors/ {
        internal;
        default_type application/json;
        location = /errors/413.json { return 413 '{"detail":"Files are limited to 10 MB"}'; }
        location = /errors/unavailable.json { return 503 '{"detail":"The API is not responding; try again shortly"}'; }
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Sign-in throttling is per client IP; the API is reachable only through this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        # Reading an invoice with the model can take a while.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
